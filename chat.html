<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پشتیبانی و ارسال رسید</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- هدر صفحه چت -->
    <header class="header">
        <button class="menu-btn" onclick="window.location.href='index.html'">➜ بازگشت</button>
        <span style="font-size: 14px; font-weight: bold; color: #60a5fa;">گفتگو با پشتیبانی</span>
    </header>

    <main class="container" style="max-width: 500px; margin: 0 auto;">
        <!-- کارت پیام راهنما -->
        <div style="background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 15px; margin-bottom: 15px; font-size: 13px; line-height: 1.7; color: #cbd5e1; backdrop-filter: blur(8px);">
            <div style="color: #60a5fa; font-weight: bold; margin-bottom: 5px;">راهنمای ارسال پیام و رسید:</div>
            درخواست خود را دقیق بگویید. مثلاً بگویید اطلاعات درباره کدام محصول را می‌خواهید، آیدی روبیکا یا شماره تلفن روبیکا بدهید و رسید واریز را بفرستید. همچنین می‌توانید درباره محصول سوال بپرسید.
        </div>

        <!-- باکس نمایش پیام‌ها -->
        <div class="chat-box" id="chatBox" style="background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; min-height: 300px; max-height: 400px; overflow-y: auto; padding: 12px;">
            <div style="text-align: center; color: #94a3b8; font-size: 12px; margin-top: 20px;">در حال بارگذاری پیام‌ها...</div>
        </div>

        <!-- فرم ارسال پیام -->
        <form id="chatForm" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
            <textarea id="chatInput" class="form-control" rows="3" placeholder="متن پیام خود را بنویسید..." style="resize: none;"></textarea>

            <div style="display: flex; gap: 10px; align-items: center;">
                <label for="chatImageInput" class="btn btn-secondary" style="margin: 0; width: auto; flex: 1; text-align: center; font-size: 12px; cursor: pointer;">
                    📷 انتخاب تصویر رسید
                </label>
                <input type="file" id="chatImageInput" accept="image/*" style="display: none;">

                <button type="submit" class="btn btn-primary" style="margin: 0; width: auto; flex: 1;" id="sendBtn">
                    ارسال پیام
                </button>
            </div>
            <div id="imagePreviewText" style="font-size: 11px; color: #4ade80; text-align: center;"></div>
        </form>
    </main>

    <script src="app.js"></script>
    <script>
        let selectedFile = null;

        document.addEventListener('DOMContentLoaded', () => {
            // بررسی ورود کاربر
            if (!currentUser) {
                showCustomAlert('عدم دسترسی', 'ابتدا باید وارد حساب کاربری خود شوید.', () => {
                    window.location.href = 'index.html';
                });
                return;
            }

            loadMessages();
            // بروزرسانی پیام‌ها هر ۵ ثانیه
            setInterval(loadMessages, 5000);

            // انتخاب فایل عکس
            document.getElementById('chatImageInput').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    selectedFile = e.target.files[0];
                    document.getElementById('imagePreviewText').innerText = `تصویر انتخاب شد: ${selectedFile.name}`;
                }
            });

            // ارسال فرم
            document.getElementById('chatForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const text = document.getElementById('chatInput').value.trim();
                const sendBtn = document.getElementById('sendBtn');

                if (!text && !selectedFile) {
                    return showCustomAlert('خطا', 'لطفا متنی بنویسید یا تصویری انتخاب کنید.');
                }

                sendBtn.disabled = true;
                sendBtn.innerText = 'در حال ارسال...';

                try {
                    let imageUrl = '';
                    if (selectedFile) {
                        imageUrl = await uploadToImgBB(selectedFile);
                    }

                    const messageId = Date.now().toString();
                    const msgData = {
                        sender: currentUser.username,
                        senderName: currentUser.name,
                        text: text,
                        imageUrl: imageUrl,
                        timestamp: Date.now()
                    };

                    // ذخیره در مسیر چت اختصاصی کاربر با مدیر
                    await fetch(`${API_FIREBASE}/chats/${currentUser.username}/messages/${messageId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(buildFirestoreFields(msgData))
                    });

                    // پاک‌سازی فرم
                    document.getElementById('chatInput').value = '';
                    document.getElementById('chatImageInput').value = '';
                    document.getElementById('imagePreviewText').innerText = '';
                    selectedFile = null;

                    loadMessages();
                } catch (err) {
                    showCustomAlert('خطا', 'مشکلی در ارسال پیام پیش آمد.');
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.innerText = 'ارسال پیام';
                }
            });
        });

        // بارگذاری پیام‌ها از فایربیس
        async function loadMessages() {
            const chatBox = document.getElementById('chatBox');
            try {
                const res = await fetch(`${API_FIREBASE}/chats/${currentUser.username}/messages`);
                if (!res.ok) {
                    chatBox.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 12px; margin-top: 20px;">هنوز پیامی وجود ندارد.</div>';
                    return;
                }

                const data = await res.json();
                const documents = data.documents || [];

                if (documents.length === 0) {
                    chatBox.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 12px; margin-top: 20px;">هنوز پیامی وجود ندارد.</div>';
                    return;
                }

                // مرتب‌سازی پیام‌ها بر اساس زمان
                const messages = documents.map(doc => parseFirestoreDoc(doc))
                                        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                chatBox.innerHTML = '';
                messages.forEach(msg => {
                    const isUser = msg.sender === currentUser.username;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `msg ${isUser ? 'user' : 'admin'}`;

                    let contentHtml = `<div>${msg.text || ''}</div>`;
                    if (msg.imageUrl) {
                        contentHtml += `<img src="${msg.imageUrl}" alt="تصویر ارسال شده">`;
                    }

                    msgDiv.innerHTML = contentHtml;
                    chatBox.appendChild(msgDiv);
                });

                // اسکرول به انتهای باکس چت
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                // در صورت بروز خطا در پولینگ کار خاصی انجام نده
            }
        }
    </script>
</body>
</html>
